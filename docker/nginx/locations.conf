# Fudo: locations shared by the HTTP and HTTPS servers (written into place by 40-fudo.sh)
root /usr/share/nginx/html;

# backup uploads: any size, streamed to the API instead of buffered here
location = /api/backups/upload {
  proxy_pass http://__API__;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# Uptime Kuma import: kuma.db files can be large (heartbeat history); streamed to the API
location = /api/config/import/kuma/upload {
  proxy_pass http://__API__;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 1g;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

location /api/ {
  # the YAML configuration import accepts up to 6 MB (nginx's default would stop at 1 MB)
  client_max_body_size 10m;
  proxy_pass http://__API__;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Server-sent events (live status) need unbuffered responses
  proxy_buffering off;
  proxy_read_timeout 1h;
}

location / {
  try_files $uri /index.html;
}
